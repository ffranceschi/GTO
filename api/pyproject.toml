[project]
name = "gto-api"
version = "0.1.0"
description = "API local (uso pessoal) do estudo GTO: jobs de solve, WebSocket e soluções"
requires-python = ">=3.12"
dependencies = [
    "gto-engine",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "pyyaml>=6"]

[tool.uv.sources]
gto-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gto_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../pyproject.toml"
