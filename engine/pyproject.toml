[project]
name = "gto-engine"
version = "0.1.0"
description = "Motor de cálculo GTO: avaliador de mãos, ranges, árvore de jogo e solver DCFR"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "numba>=0.60"]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "pytest-benchmark>=4", "phevaluator>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gto_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "benchmark_ref: orçamento absoluto no hardware de referência (research R9)",
    "slow: testes demorados (exaustivos)",
]
addopts = "-m 'not benchmark_ref' --benchmark-disable"

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi".msg = "Princípio III: o motor não depende de framework web."
"starlette".msg = "Princípio III: o motor não depende de framework web."
"pydantic".msg = "Princípio III: o motor não depende da camada de API."
"sqlalchemy".msg = "Princípio III: o motor não depende de banco de dados."
"uvicorn".msg = "Princípio III: o motor não depende de servidor web."
"gto_api".msg = "Princípio III: dependências fluem só da API para o motor."
