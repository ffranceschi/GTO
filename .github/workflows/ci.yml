name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --all-packages --all-groups --frozen
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        run: uv run mypy --strict engine/src api/src
      - name: pytest (motor)
        run: uv run pytest engine/tests
      - name: pytest (api)
        run: uv run pytest api/tests

  quality-gates:
    # Princípios I e II (etapa obrigatória e separada): Kuhn, Leduc e river de referência
    # com iterações fixas e limites de explotabilidade.
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --all-packages --all-groups --frozen
      - run: uv run pytest engine/tests/reference -v

  benchmarks:
    # Princípio V: regressão relativa (> 20% falha) contra o baseline da main.
    # O baseline é gravado no primeiro run da main e guardado no cache do Actions.
    runs-on: ubuntu-latest
    needs: python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --all-packages --all-groups --frozen
      - name: restaurar baseline
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: .benchmarks
          key: bench-baseline-${{ runner.os }}-main
          restore-keys: bench-baseline-${{ runner.os }}-main-
      - name: comparar com o baseline
        if: steps.baseline.outputs.cache-hit == 'true'
        run: |
          uv run pytest engine/tests/benchmarks --benchmark-enable --benchmark-only \
            --benchmark-storage=.benchmarks --benchmark-compare --benchmark-compare-fail=mean:20%
      - name: gravar baseline (main)
        if: github.ref == 'refs/heads/main'
        run: |
          rm -rf .benchmarks
          uv run pytest engine/tests/benchmarks --benchmark-enable --benchmark-only \
            --benchmark-storage=.benchmarks --benchmark-autosave
      - name: salvar baseline (main)
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .benchmarks
          key: bench-baseline-${{ runner.os }}-main-${{ github.sha }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
